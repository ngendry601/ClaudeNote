<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ClaudeNote</title>
    <meta name="description" content="Tes cours, tes flashcards et ta veille techno au même endroit." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClaudeNote" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a href="#/" class="logo"><img src="icon.svg" alt="" width="32" height="32" /><span>ClaudeNote</span></a>
        <nav class="nav" id="nav"></nav>
      </aside>
      <main class="main">
        <div id="view" class="view"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <noscript>ClaudeNote a besoin de JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
    <script>
      // Si l'appli n'a pas démarré (mise à jour incomplète, vieux fichiers en cache…), on propose de la réparer.
      // Les cours et la progression sont dans IndexedDB : ils ne sont pas touchés.
      async function repairApp() {
        try {
          if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
          if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
        } catch (e) {}
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }
      setTimeout(function () {
        if (window.__claudenoteStarted) return;
        document.getElementById('view').innerHTML =
          '<div class="empty"><h3>L\'appli n\'a pas pu démarrer</h3><p>Souvent à cause d\'une mise à jour incomplète. Tes cours sont conservés.</p>' +
          '<button class="btn primary lg" onclick="repairApp()">🔧 Réparer l\'appli</button></div>';
      }, 6000);
    </script>
  </body>
</html>
